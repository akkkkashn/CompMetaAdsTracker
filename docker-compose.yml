services:
  lxry-tracker:
    build: ./backend
    container_name: lxry-tracker
    ports:
      - "8765:8765"
    volumes:
      - ./frontend:/app/frontend:ro
      - lxry-data:/app/data
    environment:
      - META_TOKEN=${META_TOKEN}
      - META_COUNTRY=${META_COUNTRY:-SE}
      - FRONTEND_PATH=/app/frontend
    env_file:
      - .env
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lxry.rule=Host(`comptrackermeta.sircmd.me`)"
      - "traefik.http.routers.lxry.entrypoints=websecure"
      - "traefik.http.routers.lxry.tls.certresolver=myresolver"
      - "traefik.http.services.lxry.loadbalancer.server.port=8765"

volumes:
  lxry-data:
