<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LXRY Ad Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #0F0F0F; color: #E5E5E5; }
        .gold { color: #B8960A; }
        .btn { background: #B8960A; color: #0F0F0F; font-weight: 600; padding: 8px 20px; border-radius: 6px; cursor: pointer; border: none; }
        .btn:hover { opacity: 0.85; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .card { background: #1A1A1A; border: 1px solid #2A2A2A; border-radius: 8px; padding: 20px; }
        .card:hover { border-color: #3A3A3A; }
        .badge-edblad { background: #1e3a5f; color: #7db3e0; }
        .badge-mockberg { background: #3d1f5c; color: #b088d0; }
        .pill { padding: 2px 10px; border-radius: 9999px; font-size: 0.7rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; }
        .status-active { background: #14532d; color: #4ade80; }
        .status-inactive { background: #2A2A2A; color: #888; }
        .radio-group label { cursor: pointer; padding: 6px 16px; border-radius: 6px; font-size: 0.85rem; border: 1px solid #2A2A2A; transition: all 0.2s; }
        .radio-group input:checked + span { background: #B8960A; color: #0F0F0F; font-weight: 600; border-color: #B8960A; }
        .radio-group input { display: none; }
        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #0F0F0F; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen">
    <!-- Top Bar -->
    <header class="px-6 py-4 flex items-center justify-between" style="border-bottom: 1px solid #2A2A2A;">
        <h1 class="text-lg font-bold tracking-widest gold">LXRY AD TRACKER</h1>
        <div class="flex items-center gap-4 text-sm">
            <span class="text-gray-500">Last pulled: <span id="lastPulled" class="text-gray-400">Never</span></span>
            <button id="pullBtn" class="btn text-sm" onclick="manualPull()">Pull Now</button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-6">
        <!-- Filters -->
        <div class="flex flex-wrap items-center gap-6 mb-6">
            <!-- Brand -->
            <div class="radio-group flex gap-2">
                <label><input type="radio" name="brand" value="" checked onchange="applyFilters()"><span class="inline-block px-4 py-1.5 rounded border border-gray-700">All</span></label>
                <label><input type="radio" name="brand" value="Edblad" onchange="applyFilters()"><span class="inline-block px-4 py-1.5 rounded border border-gray-700">Edblad</span></label>
                <label><input type="radio" name="brand" value="Mockberg" onchange="applyFilters()"><span class="inline-block px-4 py-1.5 rounded border border-gray-700">Mockberg</span></label>
            </div>

            <!-- Status -->
            <div class="radio-group flex gap-2">
                <label><input type="radio" name="status" value="" checked onchange="applyFilters()"><span class="inline-block px-4 py-1.5 rounded border border-gray-700">All</span></label>
                <label><input type="radio" name="status" value="Active" onchange="applyFilters()"><span class="inline-block px-4 py-1.5 rounded border border-gray-700">Active</span></label>
                <label><input type="radio" name="status" value="Inactive" onchange="applyFilters()"><span class="inline-block px-4 py-1.5 rounded border border-gray-700">Inactive</span></label>
            </div>

            <!-- Sort -->
            <div class="radio-group flex gap-2">
                <label><input type="radio" name="sort" value="" checked onchange="applyFilters()"><span class="inline-block px-4 py-1.5 rounded border border-gray-700">Latest</span></label>
                <label><input type="radio" name="sort" value="impressions_est" onchange="applyFilters()"><span class="inline-block px-4 py-1.5 rounded border border-gray-700">Impressions</span></label>
            </div>

            <span id="adCount" class="ml-auto text-sm text-gray-500">0 ads</span>
        </div>

        <!-- Ad Grid -->
        <div id="adGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-20 text-gray-500">
            <div class="text-lg">No ads found</div>
            <div class="text-sm mt-2">Try pulling new data or adjusting filters</div>
        </div>
    </main>

    <script>
        let allAds = [];

        async function init() {
            await Promise.all([fetchAds(), fetchSchedule()]);
        }

        async function fetchAds() {
            try {
                const resp = await fetch('/ads');
                allAds = await resp.json();
                applyFilters();
            } catch (e) { console.error('Failed to fetch ads:', e); }
        }

        async function fetchSchedule() {
            try {
                const resp = await fetch('/schedule/next');
                const data = await resp.json();
                if (data.last_pull) {
                    document.getElementById('lastPulled').textContent = new Date(data.last_pull).toLocaleString();
                }
            } catch (e) { console.error('Failed to fetch schedule:', e); }
        }

        async function manualPull() {
            const btn = document.getElementById('pullBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Pulling...';
            try {
                await fetch('/ads/pull', { method: 'POST' });
                await Promise.all([fetchAds(), fetchSchedule()]);
            } catch (e) { console.error('Pull failed:', e); }
            btn.disabled = false;
            btn.textContent = 'Pull Now';
        }

        function getSelectedRadio(name) {
            const el = document.querySelector(`input[name="${name}"]:checked`);
            return el ? el.value : '';
        }

        function applyFilters() {
            const brand = getSelectedRadio('brand');
            const status = getSelectedRadio('status');
            const sortBy = getSelectedRadio('sort');

            let filtered = allAds.filter(ad => {
                if (brand && ad.brand !== brand) return false;
                if (status && ad.status !== status) return false;
                return true;
            });

            if (sortBy === 'impressions_est') {
                filtered.sort((a, b) => b.impressions_est - a.impressions_est);
            }

            document.getElementById('adCount').textContent = filtered.length + ' ads';
            renderAds(filtered);
        }

        function renderAds(ads) {
            const grid = document.getElementById('adGrid');
            const empty = document.getElementById('emptyState');

            if (ads.length === 0) {
                grid.innerHTML = '';
                empty.classList.remove('hidden');
                return;
            }
            empty.classList.add('hidden');

            grid.innerHTML = ads.map(ad => {
                const brandClass = ad.brand.toLowerCase() === 'edblad' ? 'badge-edblad' : 'badge-mockberg';
                const statusClass = ad.status === 'Active' ? 'status-active' : 'status-inactive';
                const impStr = ad.impressions_est > 0 ? ad.impressions_est.toLocaleString() : '--';
                const hookEsc = escapeHtml(ad.hook || 'No headline');
                const bodyEsc = escapeHtml(ad.body_copy || '');

                return `
                <div class="card flex flex-col gap-3">
                    <div class="flex items-center gap-2">
                        <span class="pill ${brandClass}">${escapeHtml(ad.brand)}</span>
                        <span class="pill ${statusClass}">${ad.status}</span>
                    </div>
                    <div class="font-semibold leading-snug">${hookEsc}</div>
                    ${bodyEsc ? `<div class="text-sm text-gray-400 line-clamp-3">${bodyEsc}</div>` : ''}
                    <div class="flex items-center gap-4 text-xs text-gray-500 mt-auto pt-2" style="border-top: 1px solid #2A2A2A;">
                        <span>${ad.run_days}d running</span>
                        <span>Impressions: ${impStr}</span>
                        <span>${ad.start_date || '--'}</span>
                    </div>
                    ${ad.snapshot_url ? `<a href="${escapeHtml(ad.snapshot_url)}" target="_blank" rel="noopener" class="block text-center text-xs py-2 rounded border border-gray-700 text-gray-400 hover:text-gray-200 transition-colors">View Ad</a>` : ''}
                </div>`;
            }).join('');
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        init();
    </script>
</body>
</html>
