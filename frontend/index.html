<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LXRY Ad Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #0F0F0F; color: #E5E5E5; }
        .gold { color: #B8960A; }
        .bg-gold { background: #B8960A; }
        .border-gold { border-color: #B8960A; }
        .card { background: #1A1A1A; border: 1px solid #2A2A2A; transition: border-color 0.2s; }
        .card:hover { border-color: #3A3A3A; }
        .stat-card { background: #1A1A1A; border: 1px solid #2A2A2A; }
        .filter-bar { background: #141414; border: 1px solid #2A2A2A; }
        .pill { padding: 2px 10px; border-radius: 9999px; font-size: 0.7rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; }
        .badge-edblad { background: #1e3a5f; color: #7db3e0; }
        .badge-mockberg { background: #3d1f5c; color: #b088d0; }
        .status-active { background: #14532d; color: #4ade80; }
        .status-inactive { background: #2A2A2A; color: #888; }
        .new-badge { background: #B8960A; color: #0F0F0F; font-weight: 600; }
        .btn { background: #B8960A; color: #0F0F0F; font-weight: 600; padding: 8px 20px; border-radius: 6px; cursor: pointer; transition: opacity 0.2s; border: none; }
        .btn:hover { opacity: 0.85; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .bookmark-btn { cursor: pointer; transition: color 0.2s; }
        .bookmark-btn:hover { color: #B8960A; }
        .bookmark-btn.saved { color: #B8960A; }
        select, input[type=range] { background: #1A1A1A; color: #E5E5E5; border: 1px solid #2A2A2A; border-radius: 6px; padding: 6px 10px; font-size: 0.85rem; }
        select:focus { outline: none; border-color: #B8960A; }
        .body-copy { max-height: 3.6em; overflow: hidden; transition: max-height 0.3s; cursor: pointer; }
        .body-copy.expanded { max-height: 500px; }
        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #0F0F0F; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .run-days-30 { color: #4ade80; }
        .run-days-60 { color: #22c55e; font-weight: 600; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0F0F0F; }
        ::-webkit-scrollbar-thumb { background: #2A2A2A; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen">
    <!-- Top Bar -->
    <header class="sticky top-0 z-50 px-6 py-4 flex items-center justify-between" style="background:#0F0F0F; border-bottom: 1px solid #2A2A2A;">
        <h1 class="text-lg font-bold tracking-widest gold">LXRY AD TRACKER</h1>
        <div class="flex items-center gap-6 text-sm">
            <div class="text-gray-500">
                Next pull: <span id="countdown" class="text-gray-300 font-mono">--:--:--</span>
            </div>
            <div class="text-gray-500">
                Last pulled: <span id="lastPulled" class="text-gray-400">Never</span>
            </div>
            <button id="pullBtn" class="btn text-sm" onclick="manualPull()">Pull Now</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-6">
        <!-- Stats Row -->
        <div id="statsRow" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
            <div class="stat-card rounded-lg p-5">
                <div class="text-gray-500 text-xs uppercase tracking-wider mb-1">Total Ads</div>
                <div id="statTotal" class="text-2xl font-bold">0</div>
            </div>
            <div class="stat-card rounded-lg p-5">
                <div class="text-gray-500 text-xs uppercase tracking-wider mb-1">Active Ads</div>
                <div id="statActive" class="text-2xl font-bold text-green-400">0</div>
            </div>
            <div class="stat-card rounded-lg p-5">
                <div class="text-gray-500 text-xs uppercase tracking-wider mb-1">New Today</div>
                <div id="statNew" class="text-2xl font-bold gold">0</div>
            </div>
            <div class="stat-card rounded-lg p-5">
                <div class="text-gray-500 text-xs uppercase tracking-wider mb-1">Avg Run Days</div>
                <div id="statAvgRun" class="text-2xl font-bold">0</div>
                <div id="statLongest" class="text-xs text-gray-500 mt-1">Longest: 0 days</div>
            </div>
        </div>

        <!-- Filter Bar -->
        <div class="filter-bar rounded-lg p-4 mb-6 flex flex-wrap items-center gap-4">
            <select id="filterBrand" onchange="applyFilters()">
                <option value="">All Brands</option>
                <option value="Edblad">Edblad</option>
                <option value="Mockberg">Mockberg</option>
            </select>
            <select id="filterStatus" onchange="applyFilters()">
                <option value="">All Status</option>
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
            </select>
            <select id="filterFormat" onchange="applyFilters()">
                <option value="">All Formats</option>
                <option value="Unboxing">Unboxing</option>
                <option value="GRWM/Styling">GRWM/Styling</option>
                <option value="Promotional">Promotional</option>
                <option value="Gift/Seasonal">Gift/Seasonal</option>
                <option value="Review/Testimonial">Review/Testimonial</option>
                <option value="Educational">Educational</option>
                <option value="Aesthetic/Visual">Aesthetic/Visual</option>
                <option value="Brand/Awareness">Brand/Awareness</option>
            </select>
            <div class="flex items-center gap-2">
                <label class="text-xs text-gray-500">Min Run Days:</label>
                <input type="range" id="filterMinDays" min="0" max="90" value="0" oninput="updateDaysLabel(); applyFilters();" class="w-24">
                <span id="daysLabel" class="text-xs text-gray-400 w-6">0</span>
            </div>
            <label class="flex items-center gap-2 cursor-pointer text-sm text-gray-400">
                <input type="checkbox" id="filterSaved" onchange="applyFilters()" class="accent-yellow-600">
                Saved only
            </label>
            <select id="sortBy" onchange="applyFilters()">
                <option value="">Latest</option>
                <option value="run_days">Run Days</option>
                <option value="impressions_est">Impressions</option>
            </select>
            <div class="ml-auto text-xs text-gray-500">
                <span id="adCount">0</span> ads
            </div>
        </div>

        <!-- Ad Grid -->
        <div id="adGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-20 text-gray-500">
            <div class="text-4xl mb-4">📡</div>
            <div class="text-lg">No ads found</div>
            <div class="text-sm mt-2">Try adjusting your filters or pull new data</div>
        </div>
    </main>

    <script>
        let allAds = [];
        let nextPullTime = null;
        let countdownInterval = null;

        // ─── Init ───
        async function init() {
            await Promise.all([fetchAds(), fetchStats(), fetchSchedule()]);
        }

        // ─── Fetch ───
        async function fetchAds() {
            try {
                const resp = await fetch('/ads');
                allAds = await resp.json();
                applyFilters();
            } catch (e) {
                console.error('Failed to fetch ads:', e);
            }
        }

        async function fetchStats() {
            try {
                const resp = await fetch('/stats');
                const stats = await resp.json();
                const t = stats._totals || {};
                document.getElementById('statTotal').textContent = t.total || 0;
                document.getElementById('statActive').textContent = t.active || 0;
                document.getElementById('statNew').textContent = t.new_today || 0;
                document.getElementById('statAvgRun').textContent = t.avg_run_days || 0;
                document.getElementById('statLongest').textContent = `Longest: ${t.longest_run_days || 0} days`;
            } catch (e) {
                console.error('Failed to fetch stats:', e);
            }
        }

        async function fetchSchedule() {
            try {
                const resp = await fetch('/schedule/next');
                const data = await resp.json();
                if (data.next_pull) {
                    nextPullTime = new Date(data.next_pull);
                    startCountdown();
                }
                if (data.last_pull) {
                    const d = new Date(data.last_pull);
                    document.getElementById('lastPulled').textContent = d.toLocaleString();
                }
            } catch (e) {
                console.error('Failed to fetch schedule:', e);
            }
        }

        // ─── Countdown ───
        function startCountdown() {
            if (countdownInterval) clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                if (!nextPullTime) return;
                const now = new Date();
                const diff = nextPullTime - now;
                if (diff <= 0) {
                    document.getElementById('countdown').textContent = 'Pulling...';
                    return;
                }
                const h = String(Math.floor(diff / 3600000)).padStart(2, '0');
                const m = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0');
                const s = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
                document.getElementById('countdown').textContent = `${h}:${m}:${s}`;
            }, 1000);
        }

        // ─── Manual Pull ───
        async function manualPull() {
            const btn = document.getElementById('pullBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Pulling...';
            try {
                await fetch('/ads/pull', { method: 'POST' });
                await Promise.all([fetchAds(), fetchStats(), fetchSchedule()]);
            } catch (e) {
                console.error('Pull failed:', e);
            }
            btn.disabled = false;
            btn.textContent = 'Pull Now';
        }

        // ─── Toggle Save ───
        async function toggleSave(adId) {
            try {
                await fetch(`/ads/${adId}/save`, { method: 'PATCH' });
                const ad = allAds.find(a => a.id === adId);
                if (ad) ad.saved = !ad.saved;
                applyFilters();
            } catch (e) {
                console.error('Save toggle failed:', e);
            }
        }

        // ─── Filters ───
        function updateDaysLabel() {
            document.getElementById('daysLabel').textContent = document.getElementById('filterMinDays').value;
        }

        function applyFilters() {
            const brand = document.getElementById('filterBrand').value;
            const status = document.getElementById('filterStatus').value;
            const format = document.getElementById('filterFormat').value;
            const minDays = parseInt(document.getElementById('filterMinDays').value);
            const savedOnly = document.getElementById('filterSaved').checked;
            const sortBy = document.getElementById('sortBy').value;

            let filtered = allAds.filter(ad => {
                if (brand && ad.brand !== brand) return false;
                if (status && ad.status !== status) return false;
                if (format && ad.format !== format) return false;
                if (minDays > 0 && ad.run_days < minDays) return false;
                if (savedOnly && !ad.saved) return false;
                return true;
            });

            if (sortBy === 'run_days') {
                filtered.sort((a, b) => b.run_days - a.run_days);
            } else if (sortBy === 'impressions_est') {
                filtered.sort((a, b) => b.impressions_est - a.impressions_est);
            }

            document.getElementById('adCount').textContent = filtered.length;
            renderAds(filtered);
        }

        // ─── Render ───
        function renderAds(ads) {
            const grid = document.getElementById('adGrid');
            const empty = document.getElementById('emptyState');

            if (ads.length === 0) {
                grid.innerHTML = '';
                empty.classList.remove('hidden');
                return;
            }
            empty.classList.add('hidden');

            grid.innerHTML = ads.map(ad => {
                const brandClass = ad.brand.toLowerCase() === 'edblad' ? 'badge-edblad' : 'badge-mockberg';
                const statusClass = ad.status === 'Active' ? 'status-active' : 'status-inactive';
                const runClass = ad.run_days >= 60 ? 'run-days-60' : ad.run_days >= 30 ? 'run-days-30' : '';
                const savedClass = ad.saved ? 'saved' : '';
                const impStr = ad.impressions_est > 0 ? ad.impressions_est.toLocaleString() : '—';
                const spendStr = ad.spend_est > 0 ? `${ad.spend_est.toLocaleString()} SEK` : '—';
                const bodyEsc = escapeHtml(ad.body_copy || '');
                const hookEsc = escapeHtml(ad.hook || 'No headline');

                return `
                <div class="card rounded-lg p-5 flex flex-col gap-3">
                    <div class="flex items-start justify-between">
                        <div class="flex items-center gap-2">
                            <span class="pill ${brandClass}">${escapeHtml(ad.brand)}</span>
                            ${ad.is_new ? '<span class="pill new-badge">NEW</span>' : ''}
                        </div>
                        <button class="bookmark-btn ${savedClass}" onclick="toggleSave('${ad.id}')" title="Save ad">
                            ${ad.saved
                                ? '<svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M5 2h14a1 1 0 011 1v19.143a.5.5 0 01-.766.424L12 18.03l-7.234 4.536A.5.5 0 014 22.143V3a1 1 0 011-1z"/></svg>'
                                : '<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 2h14a1 1 0 011 1v19.143a.5.5 0 01-.766.424L12 18.03l-7.234 4.536A.5.5 0 014 22.143V3a1 1 0 011-1z"/></svg>'
                            }
                        </button>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="pill" style="background:#2A2A2A;color:#aaa;">${escapeHtml(ad.format)}</span>
                        <span class="pill ${statusClass}">${ad.status}</span>
                    </div>
                    <div class="text-base font-semibold leading-snug">${hookEsc}</div>
                    ${bodyEsc ? `<div class="body-copy text-sm text-gray-400 leading-relaxed" onclick="this.classList.toggle('expanded')">${bodyEsc}</div>` : ''}
                    <div class="flex items-center gap-4 text-xs text-gray-500 mt-auto pt-2 border-t border-gray-800">
                        <span class="${runClass}" title="Run days">${ad.run_days}d</span>
                        <span title="Impressions est.">👁 ${impStr}</span>
                        <span title="Spend est.">💰 ${spendStr}</span>
                    </div>
                    <div class="flex items-center justify-between text-xs text-gray-600">
                        <span>${ad.platforms || '—'}</span>
                        <span>${ad.start_date || '—'}</span>
                    </div>
                    ${ad.snapshot_url ? `<a href="${escapeHtml(ad.snapshot_url)}" target="_blank" rel="noopener" class="block text-center text-xs font-medium py-2 rounded border border-gray-700 text-gray-400 hover:border-gray-500 hover:text-gray-200 transition-colors mt-1">View Ad ↗</a>` : ''}
                </div>`;
            }).join('');
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ─── Start ───
        init();
    </script>
</body>
</html>
